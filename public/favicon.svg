<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#581c87" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cyberViolet)" filter="url(#shadow)" />
  
  <!-- Inner Highlight Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
  
  <!-- Sleek White Truck Icon -->
  <g transform="translate(10, 14) scale(1.8)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="3" width="14" height="11" rx="1" fill="rgba(255,255,255,0.15)"></rect>
    <path d="M15 7h4l3 3v4h-7V7z" fill="rgba(255,255,255,0.2)"></path>
    <circle cx="5.5" cy="17" r="2.2" fill="#9333ea" stroke="#ffffff" stroke-width="1.8"></circle>
    <circle cx="17.5" cy="17" r="2.2" fill="#ec4899" stroke="#ffffff" stroke-width="1.8"></circle>
  </g>
  
  <!-- Telematics Emerald Beacon in Top Right -->
  <circle cx="50" cy="14" r="5" fill="#10b981" />
  <circle cx="50" cy="14" r="7" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.85" />
</svg>