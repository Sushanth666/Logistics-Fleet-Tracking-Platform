<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%" height="150" fill="none">
  <defs>
    <!-- Brand Cyber Violet Gradient -->
    <linearGradient id="cyberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Radar Waves Gradient -->
    <linearGradient id="beaconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7e22ce" flood-opacity="0.35" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;display=swap');
      .font-brand { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .text-title { fill: #0f172a; }
      .text-sub { fill: #475569; }
      .text-tag { fill: #64748b; }
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      @media (prefers-color-scheme: dark) {
        .text-title { fill: #ffffff; }
        .text-sub { fill: #94a3b8; }
        .text-tag { fill: #cbd5e1; }
        .card-bg { fill: #0f172a; stroke: #1e293b; }
      }
    </style>
  </defs>

  <!-- Left: Brand Squircle Icon -->
  <g transform="translate(15, 15)">
    <!-- Glow Backdrop -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#cyberViolet)" filter="url(#iconShadow)" />
    <!-- Gloss Highlight Border -->
    <rect x="1.5" y="1.5" width="117" height="117" rx="28.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Radar Pulse Waves -->
    <circle cx="95" cy="25" r="16" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2" />
    <circle cx="95" cy="25" r="10" fill="none" stroke="rgba(52, 211, 153, 0.55)" stroke-width="2" />
    <circle cx="95" cy="25" r="5" fill="#10b981" />

    <!-- Center Precision Logistics Truck (Stroke Icon) -->
    <g transform="translate(18, 26) scale(3.5)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="14" height="11" rx="1.2" fill="rgba(255,255,255,0.18)" />
      <path d="M15 7h4l3 3v4h-7V7z" fill="rgba(255,255,255,0.25)" />
      <circle cx="5.5" cy="17" r="2.2" fill="#7e22ce" stroke="#ffffff" stroke-width="1.8" />
      <circle cx="17.5" cy="17" r="2.2" fill="#db2777" stroke="#ffffff" stroke-width="1.8" />
    </g>
  </g>

  <!-- Right: Typography & Brand Badges -->
  <g transform="translate(160, 25)" class="font-brand">
    <!-- Brand Wordmark Row -->
    <g transform="translate(0, 36)">
      <text class="text-title" font-size="42" font-weight="900" letter-spacing="-1">Bharat</text>
      <text x="144" font-size="42" font-weight="900" letter-spacing="-1" fill="url(#cyberViolet)">Logix</text>

      <!-- Indian Flag & National Node Badge -->
      <g transform="translate(272, -28)">
        <rect x="0" y="0" width="78" height="26" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
        <!-- Indian Flag -->
        <g transform="translate(8, 6.5)">
          <rect width="18" height="4.3" fill="#ff9933" rx="0.8" />
          <rect y="4.3" width="18" height="4.4" fill="#ffffff" />
          <rect y="8.7" width="18" height="4.3" fill="#128807" rx="0.8" />
          <circle cx="9" cy="6.5" r="1.8" fill="#000088" />
        </g>
        <text x="33" y="13" dominant-baseline="central" font-size="11" font-weight="800" fill="#047857" letter-spacing="0.5">IND</text>
      </g>

      <!-- AIS-140 Certified Pill -->
      <g transform="translate(360, -28)">
        <rect x="0" y="0" width="150" height="26" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1" />
        <circle cx="13" cy="13" r="3.2" fill="#c026d3" />
        <text x="23" y="13" dominant-baseline="central" font-size="9" font-weight="800" fill="#a21caf" letter-spacing="0.4">AIS-140 CERTIFIED</text>
      </g>
    </g>

    <!-- Subtitle Line -->
    <text x="2" y="68" class="text-sub" font-size="13.5" font-weight="700" letter-spacing="0.3">
      NATIONAL FLEET OPERATIONS &amp; REAL-TIME TELEMATICS PLATFORM
    </text>

    <!-- Tech & Capabilities Micro Badges -->
    <g transform="translate(2, 86)">
      <!-- Badge 1: Live GPS Telematics -->
      <g transform="translate(0, 0)">
        <rect class="card-bg" x="0" y="0" width="128" height="24" rx="12" stroke-width="1" />
        <circle cx="10" cy="12" r="3.5" fill="#10b981" />
        <text x="20" y="16" class="text-tag" font-size="10" font-weight="700">Live GPS Radar</text>
      </g>

      <!-- Badge 2: ULIP Gateway -->
      <g transform="translate(136, 0)">
        <rect class="card-bg" x="0" y="0" width="122" height="24" rx="12" stroke-width="1" />
        <circle cx="10" cy="12" r="3.5" fill="#8b5cf6" />
        <text x="20" y="16" class="text-tag" font-size="10" font-weight="700">ULIP Gateway</text>
      </g>

      <!-- Badge 3: FASTag & E-Way -->
      <g transform="translate(266, 0)">
        <rect class="card-bg" x="0" y="0" width="124" height="24" rx="12" stroke-width="1" />
        <circle cx="10" cy="12" r="3.5" fill="#ec4899" />
        <text x="20" y="16" class="text-tag" font-size="10" font-weight="700">E-Way &amp; FASTag</text>
      </g>

      <!-- Badge 4: React 19 + Vite -->
      <g transform="translate(398, 0)">
        <rect class="card-bg" x="0" y="0" width="120" height="24" rx="12" stroke-width="1" />
        <circle cx="10" cy="12" r="3.5" fill="#06b6d4" />
        <text x="20" y="16" class="text-tag" font-size="10" font-weight="700">React 19 • Vite</text>
      </g>
    </g>
  </g>
</svg>
